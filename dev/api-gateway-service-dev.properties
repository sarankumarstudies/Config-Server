# API Gateway Service - Development Configuration
# This file should be placed in your Config Server Git repository

spring.application.name=api-gateway-service
server.port=8000

# ========================================
# API Gateway Routes Configuration
# ========================================

# Enable Eureka-based service discovery
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Route 1: Product Service
spring.cloud.gateway.routes[0].id=product-service
spring.cloud.gateway.routes[0].uri=lb://PRODUCT-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/products/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=0

# Route 2: Order Service
spring.cloud.gateway.routes[1].id=order-service
spring.cloud.gateway.routes[1].uri=lb://ORDER-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/orders/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=0

# ========================================
# RabbitMQ Configuration
# ========================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# ========================================
# Actuator Configuration
# ========================================
management.endpoints.web.exposure.include=health,info,refresh,busrefresh,gateway
management.endpoint.health.show-details=always

# ========================================
# Eureka Configuration
# ========================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
